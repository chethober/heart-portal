name: 🐛 Bug report
description: Something is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!

        ⚠️ **Do not include real patient data** (names, national IDs, phone numbers, reports or
        screenshots of them). Use the demo data or obviously fake values.
        Security problems belong in a [private advisory](https://github.com/chethober/echocardiography/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Which role were you logged in as, and what did you do?
      placeholder: |
        1. Log in as a technician
        2. Open New echo study
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main @ abc1234
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Docker or other setup, PHP and PostgreSQL versions, browser.
    validations:
      required: false
  - type: checkboxes
    id: phi
    attributes:
      label: Patient data
      options:
        - label: This report contains no real patient data.
          required: true
