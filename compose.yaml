services:
  app:
    build:
      context: ./docker
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      # Docker's IPv6 route to Packagist is unreliable here; force IPv4 for Composer.
      COMPOSER_IPRESOLVE: 4
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE:-echo}
      POSTGRES_USER: ${DB_USERNAME:-echo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-54320}:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-echo} -d ${DB_DATABASE:-echo}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"

volumes:
  pgsql-data:
